# Board: ESP32 DevKit V1 (Espressif)
# Definition: definitions/boards/esp32-devkit-v1/manifest.yaml

esphome:
  name: quirky
  friendly_name: quirky
  on_boot:
    priority: 600
    then:
      - script.execute:
          id: display_init
          i2caddr: 0x3A
      - script.execute:
          id: display_init
          i2caddr: 0x3E
      - script.execute:
          id: display_init
          i2caddr: 0x3C
      - script.execute:
          id: display_init
          i2caddr: 0x38
      - number.set:
          id: speaker_volume
          value: 0.1
      - number.set:
          id: backlights
          value: 0.2
      - rtttl.play: mario:d=4,o=5,b=100:16e6,16e6,32p,8e6,16c6,8e6,8g6
        #,8p,8g,8p,8c6,16p,8g,16p,8e,16p,8a,8b,16a#,8a,16g.,16e6,16g6,8a6,16f6,8g6,8e6,16c6,16d6,8b,16p,8c6,16p,8g,16p,8e,16p,8a,8b,16a#,8a,16g.,16e6,16g6,8a6,16f6,8g6,8e6,16c6,16d6,8b,8p,16g6,16f#6,16f6,16d#6,16p,16e6,16p,16g#,16a,16c6,16p,16a,16c6,16d6,8p,16g6,16f#6,16f6,16d#6,16p,16e6,16p,16c7,16p,16c7,16c7,p,16g6,16f#6,16f6,16d#6,16p,16e6,16p,16g#,16a,16c6,16p,16a,16c6,16d6,8p,16d#6,8p,16d6,8p,16c6

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

logger:

api:
  encryption:
    key: "MT29cvMxMNZUqThw050zN19pn7WxToiZo95ppFj1mh8="
  actions:
    - action: rtttl_play
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'
  reboot_timeout: 0s
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: quirky Fallback Hotspot
    password: "iKydXPAhzYTa"

web_server:
  port: 80

captive_portal:

script:
  - id: display_init
    parameters:
      i2caddr: int
    then:
      - lambda: |
          std::vector<std::vector<uint8_t>> initcmds = {
            {0xE2},
            {0x20},
            {0xC0},
            {0x8D},
            {0xEB},
            {0x81, 0x30},
            {0xB5},
            {0xA1},
            {0x31},
            {0x46},
            {0x2D},
            {0x85},
            {0xF2, 0x00},
            {0xF3, 0x07},
            {0x90},
            {0xAF},
            {0x40}
          };
          std::vector<std::vector<uint8_t>> updatedisplaycmds = {
            {0xB0},
            {0x10},
            {0x00}
          };

          for (const auto& cmd : initcmds) {
            id(i2c_1).write(i2caddr, cmd.data(), cmd.size());
          }
          
          for (const auto& cmd : updatedisplaycmds) {
            id(i2c_1).write(i2caddr, cmd.data(), cmd.size());
          }

          uint8_t dispbuf[41];
          for (int i = 0; i<41; i++) {
            if (i % 2) {
              dispbuf[i] = 0xAA;
            } else {
              dispbuf[i] = 0x55;
            }
          }
          id(i2c_1).write(i2caddr+1, dispbuf, 41);
  
rtttl:
  id: beeper
  output: speaker_out
  gain: "0.2"

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO33
      mode:
        input: true
        pullup: true
      inverted: true
    name: "left_button"
    on_click:
      then:
        - rtttl.play: 'siren:d=8,o=5,b=100:d,e,d,e,d,e,d,e' 
  - platform: gpio
    pin:
      number: GPIO25
      mode:
        input: true
        pullup: true
      inverted: true
    name: "right_button"
    on_click:
      then:
        - rtttl.play: 'star_wars:d=16,o=5,b=100:4e,4e,4e,8c,p,g,4e,8c,p,g,4e,4p,4b,4b,4b,8c6,p,g,4d#,8c,p,g,4e,8p'
    
i2c:
  - id: i2c_1
    scl: 22
    sda: 21
    scan: true
    frequency: 400kHz

i2c_device:
  - id: guages
    address: "0x25"

number:
  - platform: template
    name: Guage 1
    id: guage_1
    max_value: 360
    min_value: 0
    step: 2
    optimistic: true
    on_value:
      then:
       - lambda: !lambda |-
           const std::array<uint8_t, 2> cmd = {static_cast<uint8_t>(x/2), 0};
           id(guages).write_bytes(0xC0, cmd);
    icon: "mdi:speedometer"
  - platform: template
    name: Guage 2
    id: guage_2
    max_value: 360
    min_value: 0
    step: 2
    optimistic: true
    on_value:
      then:
       - lambda: !lambda |-
           const std::array<uint8_t, 2> cmd = {static_cast<uint8_t>(x/2), 0};
           id(guages).write_bytes(0xE0, cmd);
    icon: "mdi:speedometer"
  - platform: template
    name: Guage 3
    id: guage_3
    max_value: 360
    min_value: 0
    step: 2
    optimistic: true
    on_value:
      then:
       - lambda: !lambda |-
           const std::array<uint8_t, 2> cmd = {static_cast<uint8_t>(x/2), 0};
           id(guages).write_bytes(0xA0, cmd);
    icon: "mdi:speedometer"
  - platform: template
    name: Guage 4
    id: guage_4
    max_value: 360
    min_value: 0
    step: 2
    optimistic: true
    on_value:
      then:
       - lambda: !lambda |-
           const std::array<uint8_t, 2> cmd = {static_cast<uint8_t>(x/2), 0};
           id(guages).write_bytes(0x80, cmd);
    icon: "mdi:speedometer"
  - platform: template
    name: backlight
    id: backlights
    max_value: 1
    min_value: 0
    step: 0.05
    optimistic: true
    on_value:
      then:
       - lambda: !lambda |-
           id(display_backlights).set_level(x);
    initial_value: 0.2
    icon: "mdi:lightbulb-on50"
  - platform: template
    name: volume
    id: speaker_volume
    min_value: 0.0
    max_value: 1
    step: 0.05
    optimistic: true
    on_value:
      then:
        - lambda: id(beeper).set_gain(x);
    initial_value: 0.1
    unit_of_measurement: "%"
    icon: "mdi:volume-high"
output:
  - platform: ledc
    id: display_backlights
    pin: GPIO32
  - platform: ledc
    pin: GPIO26
    id: speaker_out

switch:
  - platform: gpio
    name: speaker_enable
    id: speaker_en
    pin: GPIO27
    inverted: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:speaker-wireless"
